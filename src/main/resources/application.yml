server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/content_platform
    username: cp_user
    password: cp_pass
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  ai:
    ollama:
      base-url: http://ollama:11434
      chat:
        options:
          model: moondream

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true
  observability:
    tracing:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-} spanId=%X{spanId:-}] %logger{36} : %msg%n"
